<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0B1020"/>
  <circle cx="256" cy="256" r="196" fill="#111A33"/>
  <!-- Crescent: a disc minus an offset disc -->
